name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentskills CLI
        run: pip install agentskills

      - name: agentskills validate (all skills)
        run: |
          set -e
          for d in .agents/skills/*/; do
            [[ "$d" == *".deprecated"* ]] && continue
            agentskills validate "$d"
          done

      - name: SKILL.md line limit (≤200)
        run: |
          set -e
          wc -l .agents/skills/*/SKILL.md | awk '$1 > 200 && $2 !~ /total/ { print "OVER 200:", $0; exit 1 }'

      - name: P2 craft check (project-specific)
        run: |
          python3 .agents/skills/universal-skill-creator/scripts/check_p2_craft.py

      - name: L3 examples index
        run: |
          python3 .agents/skills/universal-skill-creator/scripts/build_examples_index.py
          git diff --exit-code docs/SKILL-EXAMPLES-INDEX.md || (echo "SKILL-EXAMPLES-INDEX.md out of sync — run build_examples_index.py" && exit 1)

      - name: Knowledge graph health
        run: python3 .agents/skills/knowledge-graph/scripts/graph_health.py

      - name: Knowledge graph application-mode smoke test
        run: python3 .agents/skills/knowledge-graph/scripts/validate_application_mode.py
